<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Car Parking Simulation — Official Web Edition</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: #0b0f17;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            color: #f1f5f9;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }
        #game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 750px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
            background: #14171c;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #14171c;
        }

        /* On-Screen Touch Controls for Mobile/Tablets */
        .touch-controls {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            padding: 0 16px;
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 50;
        }
        @media (pointer: coarse), (max-width: 820px) {
            .touch-controls { display: flex; }
        }
        .touch-group {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }
        .touch-btn {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            touch-action: manipulation;
            transition: transform 0.08s, background 0.08s;
        }
        .touch-btn:active {
            transform: scale(0.92);
            background: rgba(56, 189, 248, 0.35);
            border-color: #38bdf8;
        }
        .touch-btn.brake-btn {
            width: 52px;
            height: 52px;
            border-color: rgba(244, 63, 94, 0.5);
            color: #f43f5e;
            font-size: 14px;
        }
        .touch-btn.undo-btn {
            width: 48px;
            height: 48px;
            border-color: rgba(245, 158, 11, 0.5);
            color: #f59e0b;
            font-size: 15px;
        }

        /* Modals & Dialogs */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 15, 26, 0.85);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-card {
            background: #1e293b;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            text-align: center;
        }
        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 16px;
        }
        .input-field {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #f8fafc;
            font-size: 14px;
            outline: none;
        }
        .input-field:focus {
            border-color: #38bdf8;
        }
        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }
        .btn {
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
        }
        .btn-primary {
            background: #0284c7;
            color: white;
        }
        .btn-primary:hover {
            background: #0369a1;
        }
        .btn-danger {
            background: #e11d48;
            color: white;
        }
        .btn-danger:hover {
            background: #be123c;
        }
        .btn-secondary {
            background: #334155;
            color: #cbd5e1;
        }
        .btn-secondary:hover {
            background: #475569;
        }

        /* Sound Unmute Toast */
        #audio-banner {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #38bdf8;
            z-index: 60;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="audio-banner" onclick="initAudio()">🔊 Sound Active (Zero Delay)</div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <!-- Mobile Virtual Controls -->
    <div class="touch-controls">
        <div class="touch-group">
            <button class="touch-btn" id="btn-left" onmousedown="touchKey('ArrowLeft',true)" onmouseup="touchKey('ArrowLeft',false)" ontouchstart="touchKey('ArrowLeft',true);event.preventDefault();" ontouchend="touchKey('ArrowLeft',false)">◀</button>
            <button class="touch-btn" id="btn-right" onmousedown="touchKey('ArrowRight',true)" onmouseup="touchKey('ArrowRight',false)" ontouchstart="touchKey('ArrowRight',true);event.preventDefault();" ontouchend="touchKey('ArrowRight',false)">▶</button>
            <button class="touch-btn undo-btn" onclick="undoMove()">⤺ U</button>
        </div>
        <div class="touch-group">
            <button class="touch-btn brake-btn" id="btn-brake" onmousedown="touchKey(' ',true)" onmouseup="touchKey(' ',false)" ontouchstart="touchKey(' ',true);event.preventDefault();" ontouchend="touchKey(' ',false)">STOP</button>
            <button class="touch-btn" id="btn-rev" onmousedown="touchKey('ArrowDown',true)" onmouseup="touchKey('ArrowDown',false)" ontouchstart="touchKey('ArrowDown',true);event.preventDefault();" ontouchend="touchKey('ArrowDown',false)">▼</button>
            <button class="touch-btn" id="btn-gas" onmousedown="touchKey('ArrowUp',true)" onmouseup="touchKey('ArrowUp',false)" ontouchstart="touchKey('ArrowUp',true);event.preventDefault();" ontouchend="touchKey('ArrowUp',false)">▲</button>
        </div>
    </div>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="auth-modal">
        <div class="modal-card">
            <div class="modal-title" id="auth-title">Player Authentication</div>
            <p id="auth-desc" style="font-size: 13px; color: #94a3b8; margin-bottom: 12px;">Enter your secure password to log in.</p>
            <input type="password" id="auth-pass" class="input-field" placeholder="Enter Password" />
            <div id="auth-error" style="color: #f43f5e; font-size: 12px; margin-bottom: 10px; display: none;">Incorrect password!</div>
            <div class="modal-btns">
                <button class="btn btn-secondary" onclick="closeAuthModal()">Cancel</button>
                <button class="btn btn-primary" onclick="submitAuth()">Login</button>
            </div>
        </div>
    </div>
</div>

let audioCtx = null;
let fahhAudioBuffer = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    if (!fahhAudioBuffer) {
        const binaryString = atob(FAHH_B64);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        audioCtx.decodeAudioData(bytes.buffer, (buffer) => {
            fahhAudioBuffer = buffer;
            document.getElementById('audio-banner').innerText = '🔊 Audio Enabled (0ms Latency)';
            setTimeout(() => {
                document.getElementById('audio-banner').style.opacity = '0.4';
            }, 2000);
        }, (err) => console.error("Audio decode error", err));
    }
}

// Instant zero-delay sound trigger
function playFahhSound() {
    if (!audioCtx) initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if (audioCtx && fahhAudioBuffer) {
        const source = audioCtx.createBufferSource();
        source.buffer = fahhAudioBuffer;
        source.connect(audioCtx.destination);
        source.start(0);
    }
}

// Auto-unlock audio on first touch/interaction
window.addEventListener('click', initAudio, { once: true });
window.addEventListener('keydown', initAudio, { once: true });
window.addEventListener('touchstart', initAudio, { once: true });

// 2. CRYPTOGRAPHIC SECURITY (PL CO4/CO5 SHA-256 Authentication)
// ==============================================================================
async function sha256(str) {
    const buffer = new TextEncoder().encode(str + "PARK_SALT_2026");
    const digest = await crypto.subtle.digest('SHA-256', buffer);
    return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// 3. DATABASE & PERSISTENCE (LocalStorage)
// ==============================================================================
class PlayerDatabase {
    constructor() {
        this.players = [];
        this.load();
    }
    load() {
        const saved = localStorage.getItem('park_players');
        if (saved) {
            try { this.players = JSON.parse(saved); } catch(e) { this.players = []; }
        }
        if (!this.players || this.players.length === 0) {
            this.players = [
                { name: "Sumit", passHash: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855", totalScore: 2850, levelsCompleted: 3, bestCollisions: 0, bestTime: 14.2 },
                { name: "Guest", passHash: "", totalScore: 900, levelsCompleted: 1, bestCollisions: 1, bestTime: 22.5 }
            ];
            this.save();
        }
    }
    save() {
        localStorage.setItem('park_players', JSON.stringify(this.players));
    }
    getPlayer(name) {
        return this.players.find(p => p.name.toLowerCase() === name.toLowerCase());
    }
    async addPlayer(name, pass) {
        if (!name || this.getPlayer(name)) return false;
        const passHash = pass ? await sha256(pass) : "";
        this.players.push({
            name: name,
            passHash: passHash,
            totalScore: 0,
            levelsCompleted: 0,
            bestCollisions: 999,
            bestTime: 999.0
        });
        this.save();
        return true;
    }
    deletePlayer(name) {
        const idx = this.players.findIndex(p => p.name.toLowerCase() === name.toLowerCase());
        if (idx !== -1) {
            this.players.splice(idx, 1);
            this.save();
            return true;
        }
        return false;
    }
    updateScore(name, scoreToAdd, levelNum, collisions, timeSec) {
        const p = this.getPlayer(name);
        if (!p) return;
        p.totalScore += scoreToAdd;
        if (levelNum > p.levelsCompleted) p.levelsCompleted = levelNum;
        if (collisions < p.bestCollisions) p.bestCollisions = collisions;
        if (timeSec < p.bestTime) p.bestTime = timeSec;
        this.save();
    }
    getLeaderboard() {
        return [...this.players].sort((a,b) => b.totalScore - a.totalScore);
    }
}

// 4. DSA DATA STRUCTURES (PL CO3)
// ==============================================================================
class ManeuverStack {
    constructor() { this.stack = []; }
    push(pos, angle) {
        if (this.stack.length > 300) this.stack.shift();
        this.stack.push({ x: pos.x, y: pos.y, angle: angle });
    }
    pop() { return this.stack.pop(); }
    clear() { this.stack = []; }
    size() { return this.stack.length; }
}

// ==============================================================================
// 5. COA PROCESSOR (Native Assembly Emulation - CO1, CO2, CO3, CO4)
// ==============================================================================
class COAProcessor {
    constructor() {
        this.reg = { R00: 0, R01: 0, R02: 0, R03: 30 };
        this.flags = { ZF: false, SF: false, TOL_OK: false, ROT_OK: false };
        this.currentDecision = "READY";
    }
    reset() {
        this.reg.R00 = 0;
        this.reg.R01 = 0;
        this.reg.R02 = 0;
        this.reg.R03 = 30; // 30px tolerance
        this.flags = { ZF: false, SF: false, TOL_OK: false, ROT_OK: false };
        this.currentDecision = "READY";
    }
    calculateScore(collisions, timeElapsedSec) {
        this.reg.R01 = Math.min(60, collisions * 20);
        this.reg.R02 = Math.min(40, Math.floor(timeElapsedSec * 1.5));
        let base = 100 - this.reg.R01 - this.reg.R02 + this.reg.R03;
        if (base < 10) base = 10;
        this.reg.R00 = base;
        return base * 10;
    }
    executeParkingCheck(carX, carY, carAngleDeg, targetSlot) {
        if (!targetSlot) return;
        const dx = carX - targetSlot.x;
        const dy = carY - targetSlot.y;
        const distSq = dx * dx + dy * dy;
        const tolSq = this.reg.R03 * this.reg.R03; // 900

        const posOk = distSq <= tolSq;
        this.flags.TOL_OK = posOk;

        let cDeg = ((carAngleDeg % 360) + 360) % 360;
        let tDeg = ((targetSlot.targetAngle % 360) + 360) % 360;
        let diff = Math.abs(cDeg - tDeg);
        if (diff > 180) diff = 360 - diff;
        let revDiff = Math.abs(diff - 180);
        let minDiff = Math.min(diff, revDiff);

        const rotOk = minDiff <= 18.0;
        this.flags.ROT_OK = rotOk;
        this.flags.ZF = posOk && rotOk;
        this.flags.SF = !posOk;

        if (posOk && rotOk) {
            this.currentDecision = "PARK_SUCCESS_CONFIRMED";
        } else if (posOk && !rotOk) {
            this.currentDecision = "ROTATION_MISALIGNED";
        } else {
            this.currentDecision = "OUTSIDE_SLOT";
        }
    }
}

// ==============================================================================
// 6. 2D GEOMETRY, CAR & OBSTACLES
// ==============================================================================
class Vec2D {
    constructor(x=0, y=0) { this.x = x; this.y = y; }
}

class Obstacle {
    constructor(id, x, y, w, h, label) {
        this.id = id; this.x = x; this.y = y; this.w = w; this.h = h; this.label = label;
    }
    checkCollision(corners) {
        for (let pt of corners) {
            if (pt.x >= this.x && pt.x <= this.x + this.w &&
                pt.y >= this.y && pt.y <= this.y + this.h) {
                return true;
            }
        }
        return false;
    }
}

class Car {
    constructor(x=95, y=160, angle=0) {
        this.pos = new Vec2D(x, y);
        this.angle = angle;
        this.speed = 0;
        this.width = 30;
        this.length = 58;
        this.steerAngle = 0;
        this.maxSpeed = 3.0;
        this.maxReverse = -1.6;
        this.accel = 0.10;
        this.revAccel = 0.07;
        this.friction = 0.95;
        this.turnRate = 0.042;
        this.collisions = 0;
        this.isParked = false;
        this.collisionCooldown = 0;
    }
    reset(x, y, angle) {
        this.pos = new Vec2D(x, y);
        this.angle = angle;
        this.speed = 0;
        this.steerAngle = 0;
        this.collisions = 0;
        this.isParked = false;
        this.collisionCooldown = 0;
    }
    handleInput(fwd, back, left, right, brake) {
        if (this.isParked) return;
        if (fwd) {
            this.speed += this.accel;
            if (this.speed > this.maxSpeed) this.speed = this.maxSpeed;
        } else if (back) {
            this.speed -= this.revAccel;
            if (this.speed < this.maxReverse) this.speed = this.maxReverse;
        } else {
            this.speed *= this.friction;
            if (Math.abs(this.speed) < 0.03) this.speed = 0;
        }

        if (brake) {
            this.speed *= 0.85;
            if (Math.abs(this.speed) < 0.05) this.speed = 0;
        }

        if (Math.abs(this.speed) > 0.1) {
            const dir = this.speed >= 0 ? 1 : -1;
            if (left) this.angle -= this.turnRate * dir;
            if (right) this.angle += this.turnRate * dir;
        }
    }
    update() {
        this.pos.x += Math.cos(this.angle) * this.speed;
        this.pos.y += Math.sin(this.angle) * this.speed;
        if (this.collisionCooldown > 0) this.collisionCooldown--;
    }
    pushBack(dist) {
        const dir = this.speed >= 0 ? -1 : 1;
        this.pos.x += Math.cos(this.angle) * (dist * dir);
        this.pos.y += Math.sin(this.angle) * (dist * dir);
        this.speed = -this.speed * 0.4;
    }
    getCorners() {
        const hw = this.width / 2;
        const hl = this.length / 2;
        const cosA = Math.cos(this.angle);
        const sinA = Math.sin(this.angle);
        const offsets = [
            { x: hl, y: hw },
            { x: hl, y: -hw },
            { x: -hl, y: -hw },
            { x: -hl, y: hw }
        ];
        return offsets.map(o => ({
            x: this.pos.x + (o.x * cosA - o.y * sinA),
            y: this.pos.y + (o.x * sinA + o.y * cosA)
        }));
    }
    getAngleDeg() {
        return (this.angle * 180 / Math.PI) % 360;
    }
}

// Keyboard & Touch Input Listeners
const keys = {};
window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === 'u' || e.key === 'U') undoMove();
});
window.addEventListener('keyup', (e) => { keys[e.key] = false; });

function touchKey(k, val) {
    keys[k] = val;
}

function undoMove() {
    if (gameState === "PLAYING" && history.size() > 0) {
        const prev = history.pop();
        if (prev) {
            car.pos.x = prev.x;
            car.pos.y = prev.y;
            car.angle = prev.angle;
            car.speed = 0;
            alertMessage = "Maneuver Undone (Stack LIFO)";
            alertTimer = 1.2;
        }
    }
}

// ==============================================================================
// 8. COLLISION DETECTION & UPDATE CYCLE
// ==============================================================================
function checkCollisions() {
    const corners = car.getCorners();

    // 1. Boundary Check
    for (let pt of corners) {
        if (pt.x < 46 || pt.x > 754 || pt.y < 66 || pt.y > 534) {
            return { hit: true, name: "Boundary Wall", isCar: false };
        }
    }

    // 2. Concrete Barriers
    for (let obs of staticObstacles) {
        if (obs.checkCollision(corners)) {
            return { hit: true, name: obs.label, isCar: false };
        }
    }

    // 3. Apex Cones
    for (let c of apexCones) {
        for (let pt of corners) {
            const dist = Math.hypot(pt.x - c.x, pt.y - c.y);
            if (dist <= c.r + 3) {
                return { hit: true, name: "Apex Cone", isCar: false };
            }
        }
    }

    // 4. Solid Occupied Parked Cars
    for (let p of parkedCars) {
        const bMinX = p.x - p.l/2, bMaxX = p.x + p.l/2;
        const bMinY = p.y - p.w/2, bMaxY = p.y + p.w/2;
        for (let pt of corners) {
            if (pt.x >= bMinX && pt.x <= bMaxX && pt.y >= bMinY && pt.y <= bMaxY) {
                return { hit: true, name: "Occupied Car (" + p.reg + ")", isCar: true };
            }
        }
        const dx = Math.abs(car.pos.x - p.x);
        const dy = Math.abs(car.pos.y - p.y);
        if (dx <= 46 && dy <= 28) {
            return { hit: true, name: "Occupied Car (" + p.reg + ")", isCar: true };
        }
    }

    return { hit: false };
}

function update(dt) {
    pulseTimer += dt * 4;

    if (alertTimer > 0) {
        alertTimer -= dt;
        if (alertTimer <= 0) alertMessage = "";
    }

    if (gameState !== "PLAYING") return;

    timeRemaining -= dt;
    if (timeRemaining <= 0) {
        timeRemaining = 0;
        failReason = "Time Expired!";
        playFahhSound();
        gameState = "LEVEL_FAIL";
        return;
    }

    const fwd = keys['w'] || keys['W'] || keys['ArrowUp'];
    const back = keys['s'] || keys['S'] || keys['ArrowDown'];
    const left = keys['a'] || keys['A'] || keys['ArrowLeft'];
    const right = keys['d'] || keys['D'] || keys['ArrowRight'];
    const brake = keys[' '];

    car.handleInput(fwd, back, left, right, brake);
    car.update();

    // Maneuver Stack Record every 0.3s
    maneuverTimer += dt;
    if (maneuverTimer >= 0.3) {
        history.push(car.pos, car.angle);
        maneuverTimer = 0;
    }

    // Collision Check
    if (car.collisionCooldown === 0) {
        const col = checkCollisions();
        if (col.hit) {
            car.collisions++;
            car.collisionCooldown = 25; // frames cooldown
            playFahhSound();

            if (col.isCar) {
                alertMessage = "Car slot is occupied!";
                alertTimer = 2.5;
                car.pushBack(14);
            } else {
                car.pushBack(10);
            }

            if (car.collisions >= 2) {
                failReason = "Max Collisions Exceeded! (2 / 2 hits)";
                playFahhSound();
                gameState = "LEVEL_FAIL";
                return;
            }
        }
    }

    // Target Check via COA Processor
    coa.executeParkingCheck(car.pos.x, car.pos.y, car.getAngleDeg(), targetSlot);

    if (coa.currentDecision === "PARK_SUCCESS_CONFIRMED" && Math.abs(car.speed) < 0.60 && !car.isParked) {
        car.isParked = true;
        const initialTime = currentLevel === 1 ? 30.0 : (currentLevel === 2 ? 28.0 : 26.0);
        const timeTaken = initialTime - timeRemaining;
        currentScore = coa.calculateScore(car.collisions, timeTaken);
        totalScore += currentScore;
        db.updateScore(activePlayer, currentScore, currentLevel, car.collisions, timeTaken);

        if (currentLevel < 3) {
            gameState = "LEVEL_WIN";
        } else {
            gameState = "GAME_WON";
        }
    }
}

// 9. RENDERING ENGINE (CG CO3, CO4, CO5, CO6)
// ==============================================================================
function render() {
    ctx.clearRect(0, 0, 800, 600);

    if (gameState === "PLAYING" || gameState === "LEVEL_WIN" || gameState === "LEVEL_FAIL" || gameState === "GAME_WON") {
        renderBlueprintScene();
        renderHUD();

        if (gameState === "LEVEL_WIN") renderWinPopup();
        if (gameState === "LEVEL_FAIL") renderFailPopup();
        if (gameState === "GAME_WON") renderGameWonPopup();

    } else if (gameState === "MENU") {
        renderMainMenu();
    } else if (gameState === "LEADERBOARD") {
        renderLeaderboard();
    } else if (gameState === "PLAYER_SELECT") {
        renderPlayerSelect();
    }
}

function renderBlueprintScene() {
    // 1. Grid Ground
    ctx.fillStyle = "#14171c";
    ctx.fillRect(0, 0, 800, 600);

    ctx.strokeStyle = "#1f2530";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 40; x <= 760; x += 40) {
        ctx.moveTo(x, 60); ctx.lineTo(x, 540);
    }
    for (let y = 60; y <= 540; y += 40) {
        ctx.moveTo(40, y); ctx.lineTo(760, y);
    }
    ctx.stroke();

    // 2. Wide Drivable Roadway Underlay
    if (guidePath.length >= 2) {
        ctx.fillStyle = "#18202c";
        for (let i = 0; i < guidePath.length - 1; i++) {
            const p1 = guidePath[i], p2 = guidePath[i+1];
            ctx.beginPath();
            ctx.arc(p1.x, p1.y, 65, 0, Math.PI * 2);
            ctx.arc(p2.x, p2.y, 65, 0, Math.PI * 2);
            ctx.fill();

            const dx = p2.x - p1.x, dy = p2.y - p1.y;
            const len = Math.hypot(dx, dy);
            if (len > 0) {
                const nx = -dy / len * 65, ny = dx / len * 65;
                ctx.beginPath();
                ctx.moveTo(p1.x - nx, p1.y - ny);
                ctx.lineTo(p1.x + nx, p1.y + ny);
                ctx.lineTo(p2.x + nx, p2.y + ny);
                ctx.lineTo(p2.x - nx, p2.y - ny);
                ctx.closePath();
                ctx.fill();
            }
        }
    }

    // 3. Occupied Parking Stall Outlines (Clean - No Text Overlays)
    if (currentLevel === 1) {
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(46, 230, 204, 304);
        ctx.strokeStyle = "#f43f5e";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(250, 230); ctx.lineTo(250, 534);
        ctx.stroke();

        ctx.strokeStyle = "#64748b";
        ctx.lineWidth = 1.5;
        ctx.setLineDash([8, 8]);
        ctx.beginPath();
        ctx.moveTo(46, 334); ctx.lineTo(250, 334);
        ctx.moveTo(46, 434); ctx.lineTo(250, 434);
        ctx.stroke();
        ctx.setLineDash([]);
    } else if (currentLevel === 3) {
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(590, 66, 164, 114);
        ctx.strokeStyle = "#f43f5e";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(590, 66); ctx.lineTo(590, 180);
        ctx.stroke();

        ctx.strokeStyle = "#64748b";
        ctx.lineWidth = 1.5;
        ctx.setLineDash([8, 8]);
        ctx.beginPath();
        ctx.moveTo(590, 123); ctx.lineTo(754, 123);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // 4. Outer Boundary Walls
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 12;
    ctx.strokeRect(40, 60, 720, 480);

    // 5. Static Obstacles
    for (let obs of staticObstacles) {
        ctx.fillStyle = "#334155";
        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        ctx.strokeStyle = "#64748b";
        ctx.lineWidth = 2;
        ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
    }

    // 6. Solid Parked Cars
    for (let p of parkedCars) {
        drawParkedCar(p.x, p.y, p.w, p.l, p.col, p.reg);
    }

    // 7. Apex Cones
    for (let c of apexCones) {
        ctx.fillStyle = "#ea580c";
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r * 0.45, 0, Math.PI * 2);
        ctx.fill();
    }

    // 8. Navigation Guide Path & Animated Chevrons
    if (guidePath.length >= 2) {
        ctx.strokeStyle = "rgba(56, 189, 248, 0.45)";
        ctx.lineWidth = 2.5;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(guidePath[0].x, guidePath[0].y);
        for (let i = 1; i < guidePath.length; i++) {
            ctx.lineTo(guidePath[i].x, guidePath[i].y);
        }
        ctx.stroke();
        ctx.setLineDash([]);

        // Chevrons
        for (let i = 0; i < guidePath.length - 1; i++) {
            const p1 = guidePath[i], p2 = guidePath[i+1];
            const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
            const dx = p2.x - p1.x, dy = p2.y - p1.y;
            const len = Math.hypot(dx, dy);
            if (len > 0) {
                const ux = dx / len, uy = dy / len;
                ctx.strokeStyle = "#38bdf8";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(mx - ux * 8 - uy * 6, my - uy * 8 + ux * 6);
                ctx.lineTo(mx + ux * 8, my + uy * 8);
                ctx.lineTo(mx - ux * 8 + uy * 6, my - uy * 8 - ux * 6);
                ctx.stroke();
            }
        }
    }

    // 9. Target Parking Slot (PARK Bay with Glowing Pulsing Beacon)
    if (targetSlot) {
        const scale = 1.0 + Math.sin(pulseTimer) * 0.04;
        const w = targetSlot.width * scale;
        const h = targetSlot.height * scale;

        ctx.save();
        ctx.translate(targetSlot.x, targetSlot.y);

        // Golden glow
        ctx.fillStyle = "rgba(245, 158, 11, 0.16)";
        ctx.fillRect(-w/2, -h/2, w, h);

        ctx.strokeStyle = "#f59e0b";
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 6]);
        ctx.strokeRect(-w/2, -h/2, w, h);
        ctx.setLineDash([]);

        // Tire bumper stop
        ctx.strokeStyle = "#f59e0b";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(-w/2 + 6, -h/2 + 6);
        ctx.lineTo(w/2 - 6, -h/2 + 6);
        ctx.stroke();

        ctx.fillStyle = "#f59e0b";
        ctx.font = "bold 16px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("PARK", 0, 0);

        ctx.restore();
    }

    // 10. Player Car
    drawPlayerCar();

    // Footer Info
    ctx.fillStyle = "#94a3b8";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "left";
    let footer = currentLevel === 1 ? "BLUEPRINT // LEVEL 1: BEGINNER (OCCUPIED BAYS // 130px PATH)" :
                 (currentLevel === 2 ? "BLUEPRINT // LEVEL 2: INTERMEDIATE (SLALOM COURSE // EAST BAYS)" :
                                      "BLUEPRINT // LEVEL 3: ADVANCED (CUL-DE-SAC ALCOVE // 0 SHORTCUTS)");
    ctx.fillText(footer, 45, 570);
    ctx.textAlign = "right";
    ctx.fillText("Min Clearance: 130px | Solid Parked Cars", 755, 570);
}

function drawPlayerCar() {
    ctx.save();
    ctx.translate(car.pos.x, car.pos.y);
    ctx.rotate(car.angle);

    // Headlight Beams
    const gradient = ctx.createRadialGradient(car.length/2, 0, 5, car.length/2 + 100, 0, 120);
    gradient.addColorStop(0, "rgba(254, 240, 138, 0.45)");
    gradient.addColorStop(1, "rgba(254, 240, 138, 0)");
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.moveTo(car.length/2, -10);
    ctx.lineTo(car.length/2 + 110, -45);
    ctx.lineTo(car.length/2 + 110, 45);
    ctx.lineTo(car.length/2, 10);
    ctx.closePath();
    ctx.fill();

    // Car Shadow
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.fillRect(-car.length/2 - 2, -car.width/2 - 2, car.length + 4, car.width + 4);

    // Car Body (Cyan Sports Car)
    ctx.fillStyle = "#0284c7";
    ctx.fillRect(-car.length/2, -car.width/2, car.length, car.width);

    // Roof & Windshields
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(-car.length/2 + 12, -car.width/2 + 4, car.length - 24, car.width - 8);

    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(-car.length/2 + 16, -car.width/2 + 6, car.length - 32, car.width - 12);

    // Headlights
    ctx.fillStyle = "#fef08a";
    ctx.fillRect(car.length/2 - 3, -car.width/2 + 3, 3, 6);
    ctx.fillRect(car.length/2 - 3, car.width/2 - 9, 3, 6);

    // Taillights
    ctx.fillStyle = "#ef4444";
    ctx.fillRect(-car.length/2, -car.width/2 + 3, 3, 6);
    ctx.fillRect(-car.length/2, car.width/2 - 9, 3, 6);

    ctx.restore();
}

function drawParkedCar(x, y, w, l, col, reg) {
    ctx.save();
    ctx.translate(x, y);

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillRect(-l/2 - 2, -w/2 - 2, l + 4, w + 4);

    // Body
    ctx.fillStyle = col;
    ctx.fillRect(-l/2, -w/2, l, w);

    // Cabin
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(-l/2 + 8, -w/2 + 3, l - 16, w - 6);

    // Lights
    ctx.fillStyle = "#fef08a";
    ctx.fillRect(l/2 - 2, -w/2 + 2, 2, 5);
    ctx.fillRect(l/2 - 2, w/2 - 7, 2, 5);

    ctx.fillStyle = "#ef4444";
    ctx.fillRect(-l/2, -w/2 + 2, 2, 5);
    ctx.fillRect(-l/2, w/2 - 7, 2, 5);

    ctx.restore();
}

function drawBtn(x, y, w, h, label, col, fontSize=13) {
    ctx.fillStyle = col;
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = "rgba(255,255,255,0.2)";
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold " + fontSize + "px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, x + w/2, y + h/2);
}

// ==============================================================================
// 12. MOUSE CLICK / INTERACTION SYSTEM
// ==============================================================================
canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;

    if (gameState === "MENU") {
        if (inBox(mx, my, 260, 220, 280, 48)) startGame(1);
        else if (inBox(mx, my, 260, 280, 280, 48)) startGame(2);
        else if (inBox(mx, my, 260, 340, 280, 48)) startGame(3);
        else if (inBox(mx, my, 260, 400, 280, 44)) gameState = "LEADERBOARD";
        else if (inBox(mx, my, 260, 455, 280, 44)) gameState = "PLAYER_SELECT";

    } else if (gameState === "PLAYING") {
        if (inBox(mx, my, 700, 16, 50, 30)) gameState = "MENU";

    } else if (gameState === "LEVEL_WIN") {
        if (inBox(mx, my, 250, 330, 300, 45)) startGame(currentLevel + 1);
        else if (inBox(mx, my, 250, 390, 140, 40)) startGame(currentLevel);
        else if (inBox(mx, my, 410, 390, 140, 40)) gameState = "MENU";

    } else if (gameState === "LEVEL_FAIL") {
        if (inBox(mx, my, 250, 280, 300, 46)) startGame(currentLevel);
        else if (inBox(mx, my, 250, 345, 300, 42)) gameState = "MENU";

    } else if (gameState === "GAME_WON") {
        if (inBox(mx, my, 250, 340, 300, 46)) startGame(1);
        else if (inBox(mx, my, 250, 405, 300, 42)) gameState = "LEADERBOARD";

    } else if (gameState === "LEADERBOARD") {
        if (inBox(mx, my, 300, 510, 200, 44)) gameState = "MENU";

    } else if (gameState === "PLAYER_SELECT") {
        const players = db.players;
        for (let i = 0; i < Math.min(5, players.length); i++) {
            const y = 110 + i * 65;
            if (inBox(mx, my, 480, y + 10, 80, 32)) {
                // Select player
                triggerPlayerLogin(players[i]);
                return;
            }
            if (inBox(mx, my, 570, y + 10, 65, 32)) {
                // Delete player
                if (confirm("Delete player account " + players[i].name + "?")) {
                    db.deletePlayer(players[i].name);
                    if (activePlayer === players[i].name) {
                        activePlayer = db.players.length > 0 ? db.players[0].name : "Player 1";
                    }
                }
                return;
            }
        }

        if (inBox(mx, my, 200, 490, 180, 44)) {
            const name = prompt("Enter new player name:");
            if (name && name.trim()) {
                const pass = prompt("Enter account password (or leave empty):");
                db.addPlayer(name.trim(), pass ? pass.trim() : "").then(ok => {
                    if (ok) activePlayer = name.trim();
                    else alert("Player name already exists!");
                });
            }
        } else if (inBox(mx, my, 420, 490, 180, 44)) {
            gameState = "MENU";
        }
    }
});

function inBox(x, y, bx, by, bw, bh) {
    return x >= bx && x <= bx + bw && y >= by && y <= by + bh;
}

let pendingPlayer = null;
function triggerPlayerLogin(player) {
    if (!player.passHash) {
        activePlayer = player.name;
        gameState = "MENU";
    } else {
        pendingPlayer = player;
        document.getElementById('auth-title').innerText = "Login: " + player.name;
        document.getElementById('auth-pass').value = "";
        document.getElementById('auth-error').style.display = "none";
        document.getElementById('auth-modal').style.display = "flex";
        document.getElementById('auth-pass').focus();
    }
}

async function submitAuth() {
    if (!pendingPlayer) return;
    const pass = document.getElementById('auth-pass').value;
    const hash = await sha256(pass);
    if (hash === pendingPlayer.passHash) {
        activePlayer = pendingPlayer.name;
        closeAuthModal();
        gameState = "MENU";
    } else {
        document.getElementById('auth-error').style.display = "block";
    }
}

function closeAuthModal() {
    document.getElementById('auth-modal').style.display = "none";
    pendingPlayer = null;
}

// ==============================================================================
// 13. GAME LOOP (60 FPS)
// ==============================================================================
let lastTime = performance.now();
function gameLoop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);
